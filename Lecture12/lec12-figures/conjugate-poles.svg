<svg xmlns="http://www.w3.org/2000/svg" width="440" height="155" viewBox="0 0 440 155" role="img" aria-labelledby="title description">
  <title id="title">Conjugate poles</title>
  <desc id="description">The points z_k above the real axis and conjugate z_k below it are reflections across that axis.</desc>
  <rect width="440" height="155" fill="#fff"/>
  <path d="M24 77.5H416" stroke="#526576" stroke-width="1.7"/>
  <g fill="#1f2a37">
    <circle cx="220" cy="35" r="3.2"/>
    <circle cx="220" cy="120" r="3.2"/>
  </g>
  <g font-family="Georgia, 'Times New Roman', serif" font-size="27" font-style="italic" fill="#1f2a37">
    <text x="236" y="40">z<tspan baseline-shift="sub" font-size="17">k</tspan></text>
    <text x="236" y="125">z<tspan baseline-shift="sub" font-size="17">k</tspan></text>
  </g>
  <path d="M236 103h12" stroke="#1f2a37" stroke-width="1.4"/>
</svg>
